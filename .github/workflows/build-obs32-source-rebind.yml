name: Finalize OBS 32 startup fix

on:
  push:
    branches: [fix/obs32-source-rebind]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/obs32-source-rebind
          fetch-depth: 0

      - name: Apply validated Source Clone startup fix
        run: python scripts/apply_obs32_startup_refresh.py .

      - name: Remove experimental helpers
        run: |
          rm -f scripts/apply_obs32_bsm_init.py
          rm -f scripts/apply_obs32_bsm_rebind.py
          rm -f scripts/apply_obs32_startup_refresh.py
          rm -f .github/workflows/build-obs32-source-rebind.yml
          rmdir scripts 2>/dev/null || true

      - name: Verify cleanup
        run: |
          git diff --check
          test ! -e scripts/apply_obs32_bsm_init.py
          test ! -e scripts/apply_obs32_bsm_rebind.py
          test ! -e scripts/apply_obs32_startup_refresh.py
          grep -q "settings_target_width" src/advanced-masks.h
          grep -q "Target dimensions ready/changed" src/advanced-masks-filter.c

      - name: Commit clean source fix
        run: |
          git config user.name "xDream_s"
          git config user.email "37273978+xDreams0@users.noreply.github.com"
          git add -A
          git commit -m "Fix startup masks on delayed-size targets"
          git push origin HEAD:fix/obs32-source-rebind
