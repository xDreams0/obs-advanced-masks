name: Build OBS 32 source rebind test

on:
  push:
    branches: [fix/obs32-source-rebind]
  workflow_dispatch:

env:
  PLUGIN_NAME: obs-advanced-masks
  OBS_VERSION: 28.0.0-rc1

jobs:
  windows-x64:
    name: Windows x64 portable
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_SYSTEM_VERSION: "10.0.18363.657"
      WINDOWS_DEPS_VERSION: "2022-08-02"
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1.3

      - name: Checkout OBS
        uses: actions/checkout@v4.1.1
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          submodules: recursive

      - name: Checkout patched plugin branch
        uses: actions/checkout@v4.1.1
        with:
          path: plugins/${{ env.PLUGIN_NAME }}

      - name: Apply OBS 32 source rebind patch
        shell: pwsh
        run: |
          git -C ".\plugins\${{ env.PLUGIN_NAME }}" apply --check ".\patches\obs32-source-rebind.patch"
          git -C ".\plugins\${{ env.PLUGIN_NAME }}" apply ".\patches\obs32-source-rebind.patch"
          git -C ".\plugins\${{ env.PLUGIN_NAME }}" diff --check
          git -C ".\plugins\${{ env.PLUGIN_NAME }}" diff -- src/mask-bsm.c src/mask-source.c

      - name: Add plugin to OBS CMake
        shell: cmd
        run: echo add_subdirectory(${{ env.PLUGIN_NAME }}) > plugins\CMakeLists.txt

      - name: Fetch OBS tags
        run: git fetch --prune --tags --unshallow

      - name: Install Qt prerequisite
        shell: pwsh
        run: |
          curl.exe -kLO "https://github.com/obsproject/obs-deps/releases/download/${{ env.WINDOWS_DEPS_VERSION }}/windows-deps-qt6-${{ env.WINDOWS_DEPS_VERSION }}-x64.zip" -f --retry 5 -C -
          7z x "windows-deps-qt6-${{ env.WINDOWS_DEPS_VERSION }}-x64.zip" -o"${{ github.workspace }}/cmbuild/deps"

      - name: Install OBS pre-built dependencies
        shell: pwsh
        run: |
          curl.exe -kLO "https://github.com/obsproject/obs-deps/releases/download/${{ env.WINDOWS_DEPS_VERSION }}/windows-deps-${{ env.WINDOWS_DEPS_VERSION }}-x64.zip" -f --retry 5 -C -
          7z x "windows-deps-${{ env.WINDOWS_DEPS_VERSION }}-x64.zip" -o"${{ github.workspace }}/cmbuild/deps"

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\package, .\build | Out-Null
          cmake -S . -B "${{ github.workspace }}/build" -G"${{ env.CMAKE_GENERATOR }}" -DCMAKE_PREFIX_PATH:PATH="${{ github.workspace }}/cmbuild/deps" -Ax64 -DCMAKE_SYSTEM_VERSION="${{ env.CMAKE_SYSTEM_VERSION }}" -DBUILD_BROWSER=false -DBUILD_VST=false -DBUILD_VIRTUALCAM=false -DBUILD_CAPTIONS=false -DCOMPILE_D3D12_HOOK=false -DENABLE_SCRIPTING=false -DDepsPath="${{ github.workspace }}/cmbuild/deps" -DDepsPath64="${{ github.workspace }}/cmbuild/deps" -DQTDIR="${{ github.workspace }}/cmbuild/deps/qt6" -DCOPIED_DEPENDENCIES=FALSE -DCOPY_DEPENDENCIES=TRUE -DENABLE_PLUGINS=TRUE -DDISABLE_PLUGINS=FALSE -DENABLE_BROWSER=FALSE -DENABLE_WEBSOCKET=FALSE

      - name: Build
        run: msbuild /m /p:Configuration=RelWithDebInfo .\build\obs-studio.sln

      - name: Create portable OBS package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\package\obs-plugins\64bit | Out-Null
          New-Item -ItemType Directory -Force -Path .\package\data\obs-plugins\${{ env.PLUGIN_NAME }} | Out-Null
          Copy-Item ".\build\rundir\RelWithDebInfo\obs-plugins\64bit\${{ env.PLUGIN_NAME }}.dll" ".\package\obs-plugins\64bit\${{ env.PLUGIN_NAME }}.dll"
          Copy-Item ".\build\rundir\RelWithDebInfo\data\obs-plugins\${{ env.PLUGIN_NAME }}\*" ".\package\data\obs-plugins\${{ env.PLUGIN_NAME }}\" -Recurse

      - name: Upload portable plugin
        uses: actions/upload-artifact@v4.3.1
        with:
          name: obs-advanced-masks-obs32-source-rebind-windows-x64
          path: package/*
